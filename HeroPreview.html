<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WaldyKits — Hero Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--black:#0a0a0a;--white:#fff;--soft:#f6f6f4;--line:#e7e7e3;--gray:#6b6b6b;--accent:#1a56db;
        --display:'Barlow Condensed',sans-serif;--body:'Inter',sans-serif}
  body{font-family:var(--body);background:var(--white);color:var(--black);overflow-x:hidden}

  /* ── INTRO ── */
  .intro{position:fixed;inset:0;z-index:1000;background:var(--white);display:flex;flex-direction:column;
         align-items:center;justify-content:center;gap:1.5rem;transition:transform .9s cubic-bezier(.77,0,.18,1)}
  .intro.lift{transform:translateY(-100%)}
  .intro img{width:min(220px,50vw);opacity:0;transform:scale(.85);animation:logoIn .9s .2s forwards}
  .intro-bar{width:140px;height:2px;background:var(--line);overflow:hidden;border-radius:2px}
  .intro-bar span{display:block;height:100%;width:0;background:var(--black);animation:load 1.5s .3s forwards}
  @keyframes logoIn{to{opacity:1;transform:scale(1)}}
  @keyframes load{to{width:100%}}

  /* ── NAV ── */
  nav{display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:64px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:.6rem;font-family:var(--display);font-weight:800;font-size:1.4rem;letter-spacing:.04em}
  .brand img{width:36px;height:36px;object-fit:contain}
  .brand span{color:var(--accent)}
  nav a.cta{background:var(--black);color:#fff;text-decoration:none;padding:.5rem 1.2rem;border-radius:6px;font-size:.85rem;font-weight:600}

  /* ── HERO ── */
  .hero{position:relative;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:2rem;
        max-width:1150px;margin:0 auto;padding:4rem 2rem 5rem;min-height:78vh}
  .hero::before{content:'WK';position:absolute;right:-2%;top:50%;transform:translateY(-50%);
        font-family:var(--display);font-weight:800;font-size:clamp(14rem,30vw,28rem);line-height:1;
        color:transparent;-webkit-text-stroke:1.5px var(--line);z-index:0;pointer-events:none}
  .hero-text,.showcase{position:relative;z-index:1}
  .eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-size:.72rem;font-weight:700;letter-spacing:.14em;
        text-transform:uppercase;color:var(--gray);margin-bottom:1.25rem}
  .eyebrow i{width:28px;height:2px;background:var(--accent)}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(3.2rem,8vw,6.2rem);line-height:.95;letter-spacing:-.01em;margin-bottom:1.25rem}
  h1 em{font-style:normal;color:var(--accent)}
  .lead{color:var(--gray);font-size:1.05rem;line-height:1.7;max-width:430px;margin-bottom:2rem}
  .actions{display:flex;gap:.75rem;flex-wrap:wrap}
  .btn{padding:.9rem 1.8rem;border-radius:8px;font-weight:700;font-size:.92rem;text-decoration:none;transition:transform .2s}
  .btn:hover{transform:translateY(-2px)}
  .btn.dark{background:var(--black);color:#fff}
  .btn.wa{background:#25D366;color:#fff}

  /* ── JERSEY SHOWCASE ── */
  .showcase{justify-self:center;width:min(340px,100%)}
  .card{position:relative;aspect-ratio:4/5;background:var(--soft);border:1px solid var(--line);border-radius:20px;overflow:hidden}
  .card::after{content:'';position:absolute;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#dbe6ff,transparent 70%);
        left:15%;top:15%}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        opacity:0;transform:scale(.96);transition:opacity .8s,transform .8s;z-index:1}
  .slide.on{opacity:1;transform:scale(1)}
  .slide img{width:88%;height:78%;object-fit:contain}
  .slide b{font-family:var(--display);font-size:1.3rem;letter-spacing:.05em;margin-top:.5rem}
  .dots{display:flex;justify-content:center;gap:.4rem;margin-top:1rem}
  .dots span{width:22px;height:3px;border-radius:3px;background:var(--line);transition:background .3s}
  .dots span.on{background:var(--black)}

  @media(max-width:760px){
    nav{padding:0 1.25rem}
    .hero{grid-template-columns:1fr;padding:2.5rem 1.25rem 3.5rem;min-height:auto}
    .showcase{order:-1;width:min(260px,70%)}
  }
  @media(prefers-reduced-motion:reduce){.intro{display:none}.slide{transition:none}}
</style>
</head>
<body>

<div class="intro" id="intro">
  <img src="logo.jpg" alt="WaldyKits" />
  <div class="intro-bar"><span></span></div>
</div>

<nav>
  <div class="brand"><img src="logo.jpg" alt="" />WALDY<span>KITS</span></div>
  <a class="cta" href="#">Achte Kounya</a>
</nav>

<section class="hero">
  <div class="hero-text">
    <div class="eyebrow"><i></i>Mayo Foutbòl · Ayiti</div>
    <h1>METE MAYO<br><em>EKIP OU.</em></h1>
    <p class="lead">Mayo orijinal Premier League, La Liga, Champions League ak Ekip Nasyonal Ayiti. Kòmande fasil sou WhatsApp.</p>
    <div class="actions">
      <a class="btn dark" href="shop.html">Gade Mayo yo</a>
      <a class="btn wa" href="https://wa.me/50940303686" target="_blank" rel="noopener">WhatsApp</a>
    </div>
  </div>

  <div class="showcase">
    <div class="card" id="card">
      <div class="slide on"><img src="https://saeta.us/cdn/shop/files/camisetafansazulmodelofrente_1024x1024.jpg?v=1775759224" alt="" /><b>HAITI</b></div>
      <div class="slide"><img src="https://i.pinimg.com/736x/95/bf/c1/95bfc1d1d5e96527f643bc608f2c050b.jpg" alt="" /><b>FC BARCELONA</b></div>
      <div class="slide"><img src="https://i.pinimg.com/736x/06/6b/d5/066bd5f7963a786279b39ef3dd6661fd.jpg" alt="" /><b>REAL MADRID</b></div>
      <div class="slide"><img src="https://i.pinimg.com/1200x/bc/3d/b3/bc3db336977271a0ff5cffd3144dcc71.jpg" alt="" /><b>BREZIL</b></div>
    </div>
    <div class="dots" id="dots"><span class="on"></span><span></span><span></span><span></span></div>
  </div>
</section>

<script>
  // Intro: show once per visit, then lift
  var intro = document.getElementById('intro'), seen = false;
  try { seen = sessionStorage.getItem('wk_intro'); } catch(e) {}
  if (seen) { intro.style.display = 'none'; }
  else {
    setTimeout(function(){ intro.classList.add('lift'); }, 2000);
    setTimeout(function(){ intro.style.display = 'none'; }, 3000);
    try { sessionStorage.setItem('wk_intro', '1'); } catch(e) {}
  }

  // Jersey rotation
  var slides = document.querySelectorAll('.slide'), dots = document.querySelectorAll('#dots span'), i = 0;
  setInterval(function(){
    slides[i].classList.remove('on'); dots[i].classList.remove('on');
    i = (i + 1) % slides.length;
    slides[i].classList.add('on'); dots[i].classList.add('on');
  }, 2800);
</script>
</body>
</html>
